<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduAttend - Attendance Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#4f46e5'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- App Header / Navigation -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-primary text-white p-2.5 rounded-xl shadow-sm">
                    <i class="fa-solid fa-graduation-cap text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-800 text-lg leading-tight">EduAttend</h1>
                    <p class="text-xs text-slate-500">Google Sheets Connected System</p>
                </div>
            </div>
            <div id="user-session-info" class="hidden flex items-center space-x-4">
                <span id="logged-in-user-label" class="text-sm font-medium text-slate-600"></span>
                <button onclick="logout()" class="text-sm text-red-600 hover:text-red-700 font-medium px-3 py-1.5 rounded-lg border border-red-100 bg-red-50 hover:bg-red-100 transition">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">

        <!-- Toast Notifications Box -->
        <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2"></div>

        <!-- Login Section (Default View) -->
        <section id="login-section" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-100 my-12">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Welcome Back</h2>
                <p class="text-sm text-slate-500 mt-1">Sign in to your EduAttend account</p>
            </div>
            
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700">Email or ID</label>
                    <input type="text" id="login-username" required class="mt-1 block w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-primary focus:border-primary" placeholder="e.g. CSE001 or admin@college.edu">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Password</label>
                    <input type="password" id="login-password" required class="mt-1 block w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-primary focus:border-primary" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full py-3 px-4 bg-primary text-white font-medium rounded-xl hover:bg-blue-700 transition shadow-sm">
                    Sign In
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <button onclick="loadDemoCredentials()" class="text-xs text-primary hover:underline font-medium">
                    <i class="fa-solid fa-bolt mr-1"></i> Load Demo Credentials
                </button>
            </div>
        </section>

        <!-- Dashboard Section (Hidden until login) -->
        <section id="dashboard-section" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <div>
                    <h2 class="text-xl font-bold text-slate-800" id="welcome-heading">Dashboard</h2>
                    <p class="text-sm text-slate-500">Manage records synced live with your Google Sheet.</p>
                </div>
            </div>

            <!-- Newly Integrated Simple Form Connected to Google Sheet -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 max-w-lg mx-auto my-6">
                <h3 class="text-lg font-bold text-slate-800 mb-4"><i class="fa-solid fa-user-plus text-primary mr-2"></i>Add New Student Form</h3>
                <form id="quick-student-form" onsubmit="submitNewStudentForm(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700">Student ID</label>
                        <input type="text" id="new-stu-id" required class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-primary focus:border-primary" placeholder="e.g. CSE010">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700">Full Name</label>
                        <input type="text" id="new-stu-name" required class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-primary focus:border-primary" placeholder="e.g. John Doe">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700">Email Address</label>
                        <input type="email" id="new-stu-email" required class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-primary focus:border-primary" placeholder="john@example.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700">Department</label>
                        <input type="text" id="new-stu-dept" required class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-primary focus:border-primary" placeholder="e.g. CSE">
                    </div>
                    <button type="submit" class="w-full py-2.5 px-4 bg-primary text-white font-medium rounded-xl hover:bg-blue-700 transition">
                        Save to Google Sheet
                    </button>
                </form>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        EduAttend System &copy; 2026 • Connected via Google Apps Script API
    </footer>

    <!-- JavaScript Application Logic & API Connectors -->
    <script>
        // CONFIGURATION: Replace with your actual Google Apps Script Web App URL
        const CONFIG = {
            API_URL: "https://script.google.com/macros/s/AKfycbx85BXovmD_pvWTxhZMYuWiVIZxj-EwKJZ7SuFBik8BQRxewytVrFX2nyYEL901jdH7/exec"
        };

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let bgClass = type === 'success' ? 'bg-emerald-600' : (type === 'error' ? 'bg-rose-600' : 'bg-amber-600');
            toast.className = `${bgClass} text-white px-4 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center space-x-2 transition transform translate-y-2`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 4000);
        }

        async function apiCall(action, data = {}) {
            try {
                const response = await fetch(`${CONFIG.API_URL}?action=${action}`, {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                return await response.json();
            } catch (error) {
                console.error("API Error:", error);
                return { success: false, message: error.toString() };
            }
        }

        function loadDemoCredentials() {
            document.getElementById('login-username').value = 'admin@college.edu';
            document.getElementById('login-password').value = '123';
            showToast("Demo credentials loaded!", "warning");
        }

        function handleLogin(event) {
            event.preventDefault();
            // Simple mock login toggle to reveal dashboard
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('user-session-info').classList.remove('hidden');
            document.getElementById('logged-in-user-label').innerText = document.getElementById('login-username').value;
            showToast("Logged in successfully!", "success");
        }

        function logout() {
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('user-session-info').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
            showToast("Logged out.", "warning");
        }

        async function submitNewStudentForm(event) {
            event.preventDefault();
            
            const payload = {
                StudentID: document.getElementById('new-stu-id').value.trim(),
                Name: document.getElementById('new-stu-name').value.trim(),
                Email: document.getElementById('new-stu-email').value.trim(),
                Department: document.getElementById('new-stu-dept').value.trim(),
                Semester: "3",
                Section: "A",
                Password: "123",
                Status: "Active"
            };

            showToast("Saving directly to your Google Sheet...", "warning");

            // Calls your Google Apps Script backend action
            const response = await apiCall('saveStudent', { student: payload, isEdit: false });

            if (response.success) {
                showToast("Student successfully added and synced!", "success");
                document.getElementById('quick-student-form').reset();
            } else {
                showToast("Error: " + response.message, "error");
            }
        }
    </script>
</body>
</html>
